# Render Blueprint: ONE static site for every program, one sub-path per program.
#   /goto-pm/   /bsi-b2-b3/   /bsi-a10/
# scripts/build-site.js builds all programs and assembles ./site. No server, no env vars.
# (Blueprints ask for a card on Render. Without a card, create the Static Site by hand with the same three values.)
services:
  - type: web
    runtime: static
    name: rakamin-dashboard-l1
    buildCommand: node scripts/build-site.js
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
